<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>
    <!-- 
        FLEXBOX
        Flexbox adalah sistem layout di CSS yang digunakan untuk mengatur tata letak elemen dalam satu dimensi — 
        baik dalam bentuk baris (row) maupun kolom (column).

        Flexbox memudahkan kita untuk:
            ▪️Menyusun elemen secara horizontal atau vertikal
            ▪️Mengatur jarak antar elemen
            ▪️Membuat elemen sejajar (alignment)
            ▪️Mengatur ukuran elemen secara fleksibel

        🔹 Property Penting di Flexbox:
            > display           : flex                                                  > Mengaktifkan flexbox
            > flex-direction    : row/column/row-reverse/column-reverse                 > Menentukan arah main axis
            > flex-wrap         : wrap/nowrap                                           > Mengatur apakah item diperbolehkan membuat baris baru
            > justify-content   : flex-start/center/flex-end/space-between/space-around > Mengatur alignment di main axis
            > align-items       : flex-start/center/flex-end                            > Mengatur alignment di cross axis
            > align-content     : flex-start/center/flex-end/space-between/space-around > Mengatur jarak antar baris (⚠️jika flex-wrap: wrap)
            > gap                                                                       > Memberikan serta mengatur jarak antar elemen
    -->
    <div id="parent">
        <div>01</div>
        <div>02</div>
        <div>03</div>
    </div>
</body>
</html>
