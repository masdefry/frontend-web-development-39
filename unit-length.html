<body>
    <!-- 
    em 
    - Unit length yang diperuntukan font size
    - Ukurannya relative terhadap parent nya 
    - Ketika parent tidak memiliki property font size, by default akan di kali dengan 16px
    -->

    <div id="section-01">
        <h1>Purwadhika School</h1>
    </div>

    <!-- 
        rem 
        - Unit length yang diperuntukan font size 
        - Ukurannya relative terhadap root nya (<html>)
        - Ketika root nya tidak memiliki property font size, by default akan di kali dengan 16px
    -->
    <div id="section-02">
        <h2>AI Full Stack Programming</h2>
    </div>
